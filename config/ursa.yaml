# Configuration for the NOAA RDHPCS Ursa platform.

# yamllint disable rule:anchors rule:line-length

app:
  gpu:
    batchargs: &gpu-batchargs
      --gres: 'gpu:h100:1'
      nodes: 1
      partition: '{{ app.partitions.gpu }}'
      queue: '{{ app.queues.gpu }}'
  launcher: srun --export=ALL
  partitions:
    netaccess: u1-service
    cpu: u1-compute
    gpu: gpuwf
  queues:
    netaccess: batch
    cpu: batch
    gpu: gpuwf
  platform: &platform
    account: epic
    scheduler: slurm
  quickstart:
    walltime: 00:10:00
    nodes: 1:ppn=1
    gpu:
      native: '--gres gpu:h100:1'
    data:
      native: '--mem-per-cpu 3G'
inference:
  execution:
    envcmds: !list '{{ val.slurm_script + val.inference.envcmds  }}'
training:
  execution:
    envcmds: !list '{{ val.slurm_script + val.training.envcmds }}'
val:
  slurm_script:
    - source /etc/profile.d/profile-slurm.sh
zarrs:
  common:
    execution:
      batchargs:
        --mem-per-cpu: 3G
      envcmds: !list '{{ val.slurm_script + val.zarrs.envcmds }}'
      mpiargs:
        - "--export=ALL"
